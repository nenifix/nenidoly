<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nenido</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #F1ECEC;
    --surface: #FFFFFF;
    --border: #CFCECD;
    --text: #211E1E;
    --text-secondary: #656363;
    --accent: #4B4646;
    --accent-hover: #211E1E;
    --checked: #B7B1B1;
    --input-bg: #F1ECEC;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #211E1E;
      --surface: #2A2626;
      --border: #4B4646;
      --text: #F1ECEC;
      --text-secondary: #B7B1B1;
      --accent: #B7B1B1;
      --accent-hover: #F1ECEC;
      --checked: #656363;
      --input-bg: #2A2626;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }

  .logo {
    display: flex;
    gap: 4px;
    margin-bottom: 40px;
  }

  .logo-block {
    width: 12px;
    height: 24px;
    background: var(--accent);
  }

  .logo-block.l { height: 36px; }
  .logo-block.s { height: 16px; width: 8px; }
  .logo-block.gap { background: transparent; width: 6px; }
  .logo-block.dark { background: var(--text); }

  .container {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    font-weight: 500;
  }

  .todo-form {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    border: 1px solid var(--border);
  }

  .todo-form input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .todo-form input::placeholder {
    color: var(--text-secondary);
  }

  .todo-form button {
    padding: 12px 20px;
    border: none;
    border-left: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .todo-form button:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .todo-list {
    list-style: none;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    transition: background 0.1s;
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  .todo-item:hover {
    background: var(--input-bg);
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: var(--checked);
  }

  .todo-checkbox {
    width: 16px;
    height: 16px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .todo-checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
    position: relative;
  }

  .todo-checkbox:checked::after {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    background: var(--bg);
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }

  .todo-text {
    flex: 1;
    cursor: pointer;
  }

  .todo-delete {
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    position: relative;
    flex-shrink: 0;
  }

  .todo-item:hover .todo-delete {
    opacity: 1;
  }

  .todo-delete::before,
  .todo-delete::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 1px;
    background: var(--text-secondary);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .todo-delete::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }

  .todo-delete:hover::before,
  .todo-delete:hover::after {
    background: var(--text);
  }

  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .footer {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .clear-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    padding: 6px 12px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .clear-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .count {
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="logo">
  <div class="logo-block l" style="background:#4B4646"></div>
  <div class="logo-block" style="background:#B7B1B1"></div>
  <div class="logo-block gap"></div>
  <div class="logo-block l" style="background:#4B4646"></div>
  <div class="logo-block dark"></div>
  <div class="logo-block gap"></div>
  <div class="logo-block" style="background:#B7B1B1"></div>
  <div class="logo-block dark l"></div>
  <div class="logo-block gap"></div>
  <div class="logo-block l" style="background:#4B4646"></div>
  <div class="logo-block dark"></div>
  <div class="logo-block gap"></div>
  <div class="logo-block l" style="background:#4B4646"></div>
  <div class="logo-block" style="background:#B7B1B1"></div>
  <div class="logo-block gap"></div>
  <div class="logo-block" style="background:#B7B1B1"></div>
  <div class="logo-block dark l"></div>
</div>

<div class="container">
  <h1>nenido</h1>
  <p style="font-size:11px; color:var(--text-secondary); letter-spacing:1px; text-transform:uppercase; margin-top:-16px; margin-bottom:24px;">developed by nenifix.com</p>

  <form class="todo-form" id="todoForm">
    <input type="text" id="todoInput" placeholder="add a task..." autofocus>
    <button type="submit">add</button>
  </form>

  <ul class="todo-list" id="todoList"></ul>

  <div class="footer">
    <span class="count" id="count">0 items</span>
    <button class="clear-btn" id="clearBtn">clear</button>
  </div>
</div>

<script>
  const form = document.getElementById('todoForm');
  const input = document.getElementById('todoInput');
  const list = document.getElementById('todoList');
  const count = document.getElementById('count');
  const clearBtn = document.getElementById('clearBtn');

  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  function render() {
    const active = todos.filter(t => !t.done).length;
    count.textContent = active + ' item' + (active !== 1 ? 's' : '');

    if (todos.length === 0) {
      list.innerHTML = '<li class="empty-state">no tasks yet</li>';
      return;
    }

    list.innerHTML = '';
    todos.forEach((todo, i) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' completed' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'todo-checkbox';
      cb.checked = todo.done;
      cb.addEventListener('change', () => {
        todos[i].done = cb.checked;
        save();
        render();
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = todo.text;
      span.addEventListener('click', () => {
        cb.checked = !cb.checked;
        todos[i].done = cb.checked;
        save();
        render();
      });

      const del = document.createElement('button');
      del.className = 'todo-delete';
      del.setAttribute('aria-label', 'delete');
      del.addEventListener('click', () => {
        todos.splice(i, 1);
        save();
        render();
      });

      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  });

  clearBtn.addEventListener('click', () => {
    if (todos.length === 0) return;
    todos = [];
    save();
    render();
  });

  render();
</script>

</body>
</html>
